<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electronics Group 5</title>
<style>
body{background:#0f172a;color:#fff;font-family:system-ui;padding:12px;margin:0}
.header{display:flex;gap:8px;justify-content:center;margin:12px;flex-wrap:wrap;position:sticky;top:10px;z-index:10}
.badge{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:8px 16px;font-weight:800}
.ok{color:#22c55e} .bad{color:#ef4444}
.card{background:#fff;color:#111;border-radius:18px;padding:18px;margin:14px auto;max-width:620px}
.q-title{font-size:19px;font-weight:800;margin:12px 0;line-height:1.7}
.opt{border:1.5px solid #e2e8f0;border-radius:12px;padding:12px;margin:10px 0;cursor:pointer;display:flex;gap:10px;align-items:center}
.opt:hover{background:#f1f5f9}
.correct{background:#dcfce7!important;border-color:#22c55e!important}
.wrong{background:#fee2e2!important;border-color:#ef4444!important}
.num{background:#e2e8f0;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:bold}
.tag{background:#2563eb;color:#fff;border-radius:20px;padding:4px 10px;font-size:12px}
</style>
</head>
<body>
<h3 style="text-align:center">Electronics Engineers Group 5</h3>
<div class="header">
<div class="badge" id="prog">0/0</div>
<div class="badge ok">✅ <span id="ok">0</span></div>
<div class="badge bad">❌ <span id="bad">0</span></div>
<div class="badge">📊 <span id="perc">0%</span></div>
</div>
<div id="quiz"></div>
<script>
const questions=[
{q:"ما هو المكون الذي يخزن الطاقة في المجال الكهربائي؟",options:["المقاومة","المكثف","الملف","الدايود"],correct:1},
{q:"وحدة قياس التردد هي؟",options:["أوم","هيرتز","فاراد","وات"],correct:1},
{q:"يشير stomat/o إلى؟",options:["الفم","المعدة","الأمعاء","الكبد"],correct:0}
];
let ok=0,bad=0;let answered=new Set();
function render(){
document.getElementById('prog').innerText=`${answered.size}/${questions.length}`;
document.getElementById('ok').innerText=ok;
document.getElementById('bad').innerText=bad;
document.getElementById('perc').innerText=Math.round((ok/questions.length)*100||0)+'%';
}
function build(){
let h='';
questions.forEach((qq,i)=>{
h+=`<div class="card"><span class="tag">اختيار من متعدد</span> <span class="tag" style="background:#0f172a;margin-right:6px">${i+1}</span><div class="q-title">${qq.q}</div>`;
qq.options.forEach((op,j)=>{
h+=`<div class="opt" id="q${i}o${j}" onclick="check(${i},${j})"><div class="num">${['أ','ب','ج','د'][j]}</div> ${op}</div>`;
});
h+=`</div>`;
});
document.getElementById('quiz').innerHTML=h;
}
function check(qi,oi){
if(answered.has(qi)) return;
answered.add(qi);
let q=questions[qi];
let el=document.getElementById(`q${qi}o${oi}`);
if(oi===q.correct){el.classList.add('correct'); ok++}
else{el.classList.add('wrong'); document.getElementById(`q${qi}o${q.correct}`).classList.add('correct'); bad++}
render();
}
build();render();
</script>
</body>
                          </html>
